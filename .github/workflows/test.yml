name: test

# Chỉ chạy test OFFLINE. KHÔNG gọi mạng trong CI: NSO, IMF và SBV là hạ tầng
# công, để CI gọi vào mỗi lần push là bất lịch sự và sẽ bị chặn IP.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python tests/test_parsing.py
      - run: python -m ruff check vnmacro
